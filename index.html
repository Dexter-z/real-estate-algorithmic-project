<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME HOME</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
   <header class="header">
    <nav class="navbar">
        <a href="index.html" class="logo">Prime <span>Homes</span></a>
        <ul class="nav-links" id="navlinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="properties.html">Properties</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="index.html#Testimonials">Testimonials</a></li>
            <li><a href="index.html#Contact">Contact</a></li>

        </ul>
        <a href="#Contact" class="nav-buttons">+2349033927070</a>
        <button class="menu-button" id="menubutton">==</button>

    </nav>

   </header> 
   <main>
    <section class="hero" id="home">
        <div class="hero-content">
            <p class="small-title">WELCOME TO PRIME HOMES</p>
            <h1>Find Your Dream Home</h1>
            <p>Discover Beautiful Homes, Apartments and Properties in Great Locations at 
                Affordable Prices
            </p>
            <a href="properties.html" class="hero-btn">Explore Properties</a>
            </div>
            

    </section>
    <div class="search-box">
        <label>Location</label>
        <input type="text" placeholder="Enter City or Location">

    <div class="search-item">
        <label>Property Type</label>
        <select id="typeinput">
            <option value="All">All Types</option>
            <option value="House">House</option>
            <option value="Apartment">Apartment</option>
            <option value="Villa">Villa</option>
            <option value="Cottage">Cottage</option>

        </select>

    </div>
    <div class="search-item">
        <label>Min Price</label>
        <select id="minPriceInput">
            <option value="0">$0</option>
            <option value="50000">$ 50,000</option>
            <option value="100000">$ 100,000</option>
            <option value="200000">$ 200,000</option>

        </select>

    </div>
    <div class="search-item">
        <label>Max Price</label>
        <select id="maxPriceInput">
            <option value="10000000">$ 10,000,000</option>
            <option value="5000000">$ 500,000</option>
            <option value="1000000">$ 1,000,000</option>
            <option value="2000000">$ 2,000,000</option>
        </select>

    </div>
    <button class="search-btn" onclick="filterproperties()">Search</button>
    <div class="properties-container" id="properties"></div>
    </div>

   </main>
   <script src="script.js"></script>
</body>
</html>
